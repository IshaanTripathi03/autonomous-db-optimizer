spring:
  application:
    name: db-optimizer
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
        embedding:
          api-key: ${GEMINI_API_KEY}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: NONE

app:
  datasource:
    target:
      jdbc-url: jdbc:postgresql://localhost:5532/target_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    knowledge:
      jdbc-url: jdbc:postgresql://localhost:5533/knowledge_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
