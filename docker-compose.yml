version: "3.9"
services:
  target-db:
    image: pgvector/pgvector:pg16
    container_name: target-db
    environment:
      POSTGRES_DB: target_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5532:5432"
    volumes:
      - target-db-data:/var/lib/postgresql/data
    command:
       postgres -c shared_preload_libraries=pg_stat_statements

  knowledge-db:
    image: pgvector/pgvector:pg16
    container_name: knowledge-db
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5533:5432"
    volumes:
      - knowledge-db-data:/var/lib/postgresql/data

volumes:
  target-db-data:
  knowledge-db-data:
